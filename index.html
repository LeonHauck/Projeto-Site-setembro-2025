<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Giro de Itens</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="script.js"></script>
</head>

<body>
  <div id="telaLogin" class="tela-login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">
          <i class="fas fa-chart-line"></i>
        </div>
        <h1>Giro de Itens</h1>
        <p>Sistema de Gerenciamento de Estoque</p>
      </div>

      <form id="formLogin" class="login-form">
        <div class="input-group">
          <label for="usuario">Usuário</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="usuario" placeholder="Digite seu usuário..." required />
          </div>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="senha" placeholder="Digite sua senha..." required />
          </div>
        </div>

        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>

      <p id="erroLogin" class="erro-login">
        <i class="fas fa-exclamation-circle"></i> Usuário ou senha inválidos
      </p>

      <div class="login-footer">
        <p>Credenciais de teste:</p>
        <small>dev / dev123 | gestor / gestor123 | func / func123</small>
      </div>
    </div>
  </div>
</body>

</html>
